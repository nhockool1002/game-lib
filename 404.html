<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Không tìm thấy trang | Thư Viện Game</title>
  <meta name="theme-color" content="#0b0a09" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .nf-wrap{
      min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:24px 20px; gap:14px;
    }
    .nf-code{font-family:'Be Vietnam Pro',sans-serif; font-size:56px; font-weight:800; color:var(--accent)}
    .nf-wrap h1{font-size:19px; margin:0}
    .nf-wrap p{font-size:13.5px; color:var(--txt-sec); max-width:380px; line-height:1.6; margin:0}
    .nf-home{
      display:inline-flex; align-items:center; gap:8px; margin-top:8px; background:var(--accent); color:var(--accent-ink);
      text-decoration:none; font-weight:700; font-size:13.5px; padding:11px 22px; border-radius:var(--radius-chip);
    }
    .nf-home:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-code">404</div>
    <h1>Không tìm thấy trang này</h1>
    <p>Game có thể đã bị đổi tên hoặc gỡ khỏi danh sách. Quay lại trang chủ để tìm game khác.</p>
    <a class="nf-home" href="/">← Về Thư Viện Game</a>
  </div>
</body>
</html>
